<body>
<style>
/* Layout: full-screen plan canvas between a slim header and a bottom tool panel (thumb zone) */
:root{
  --bg:#eef1f3; --panel:#ffffff; --fg:#1d2329; --muted:#66717c; --line:#d5dbe0;
  --accent:#0b6e8a; --accent-ink:#ffffff; --sel:#e8590c; --danger:#c92a2a;
  --wall:#2b3138; --floor:#fbfbf9; --floor-wet:#f3f7f9; --grid:#0b6e8a; --glass:#a9d4e3;
  --ink:#39424b; --dim:#0b6e8a;
  --c-bath:#dcecf3; --c-kitchen:#f1e6d4; --c-soft:#e4e1ee; --c-wood:#eadfcf; --c-tech:#e3e7ea;
  --c-rug:#c9b8d8; --c-plant:#cfe5c8; --c-other:#e8e8e8; --c-door:#fbfbf9; --c-wallf:#2b3138;
  --font:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12161a; --panel:#1b2026; --fg:#e7ebee; --muted:#93a0ab; --line:#2e363e;
  --accent:#4cb6d3; --accent-ink:#06222b; --sel:#ff8a3d; --danger:#ff6b6b;
  --wall:#c4ccd4; --floor:#1f252b; --floor-wet:#1d262d; --grid:#4cb6d3; --glass:#2f6b80;
  --ink:#cdd5dc; --dim:#6fcbe4;
  --c-bath:#24404c; --c-kitchen:#4a3f2e; --c-soft:#3a3650; --c-wood:#463c30; --c-tech:#363d44;
  --c-rug:#4b3d59; --c-plant:#2f4a2c; --c-other:#3a3f44; --c-door:#1f252b; --c-wallf:#c4ccd4;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12161a; --panel:#1b2026; --fg:#e7ebee; --muted:#93a0ab; --line:#2e363e;
  --accent:#4cb6d3; --accent-ink:#06222b; --sel:#ff8a3d; --danger:#ff6b6b;
  --wall:#c4ccd4; --floor:#1f252b; --floor-wet:#1d262d; --grid:#4cb6d3; --glass:#2f6b80;
  --ink:#cdd5dc; --dim:#6fcbe4;
  --c-bath:#24404c; --c-kitchen:#4a3f2e; --c-soft:#3a3650; --c-wood:#463c30; --c-tech:#363d44;
  --c-rug:#4b3d59; --c-plant:#2f4a2c; --c-other:#3a3f44; --c-door:#1f252b; --c-wallf:#c4ccd4;
  color-scheme:dark}
html{height:100%;box-sizing:border-box}
*,*::before,*::after{box-sizing:border-box}
body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;
  overflow:hidden;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button,input,select{font:inherit;color:inherit}
button{touch-action:manipulation;cursor:pointer}
#app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto;grid-template-columns:minmax(0,1fr)}
#foot .row .btn{min-width:0;padding:0 12px}
#foot .row .btn.primary{overflow:hidden;text-overflow:ellipsis}
.band{padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
header{background:var(--panel);border-bottom:1px solid var(--line);padding-block:8px;display:flex;align-items:center;gap:8px;z-index:3}
.vbtn{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start;background:none;border:0;padding:2px 4px;text-align:left}
.vbtn b{font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;display:flex;align-items:center;gap:4px}
.vbtn small{color:var(--muted);font-size:12px}
.ib{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center;flex:none}
.ib:disabled{opacity:.35}
.ib svg,.btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.ib:focus-visible,.btn:focus-visible,.chip:focus-visible,.cell:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{position:relative;min-height:0}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block;user-select:none;-webkit-user-select:none}
.hint{position:absolute;left:50%;top:10px;transform:translateX(-50%);background:var(--panel);border:1px solid var(--line);
  color:var(--muted);font-size:12.5px;padding:6px 12px;border-radius:999px;pointer-events:none;white-space:nowrap;max-width:calc(100% - 24px);overflow:hidden;text-overflow:ellipsis}
.fab{position:absolute;right:max(12px,env(safe-area-inset-right,0px));bottom:12px;display:flex;flex-direction:column;gap:8px}
footer{background:var(--panel);border-top:1px solid var(--line);padding-block:10px;padding-bottom:max(10px,env(safe-area-inset-bottom,0px));z-index:3}
.row{display:flex;gap:8px;align-items:center}
.btn{height:46px;border-radius:12px;border:1px solid var(--line);background:var(--panel);padding:0 14px;display:inline-flex;align-items:center;justify-content:center;gap:7px;font-weight:600;white-space:nowrap}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);flex:1}
.btn.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--danger)}
.btn.sm{height:40px;padding:0 10px;font-size:14px}
.tools{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:8px}
.tools .btn{padding:0;flex-direction:column;gap:2px;height:52px;font-size:11px;font-weight:600}
.selhead{display:flex;gap:8px;align-items:center}
.selhead input{flex:1;min-width:0;height:40px;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:0 10px;font-size:16px;font-weight:600}
.dims{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.stepper{display:flex;align-items:center;border:1px solid var(--line);border-radius:12px;overflow:hidden;height:46px;background:var(--bg)}
.stepper span{font-size:12px;color:var(--muted);padding:0 2px 0 9px;font-weight:600}
.stepper input{width:100%;min-width:0;border:0;background:transparent;text-align:center;font-family:var(--mono);font-size:16px;height:100%}
.stepper button{width:38px;height:100%;border:0;background:transparent;font-size:20px;color:var(--accent);flex:none}
.more{margin-top:8px;display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}
.pad{display:grid;grid-template-columns:repeat(4,40px);gap:6px}
.pad .btn{width:40px;height:40px;padding:0}
input[type=number]{-moz-appearance:textfield}
input::-webkit-outer-spin-button,input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
/* sheets */
.scrim{position:fixed;inset:0;background:rgba(10,14,18,.38);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--panel);border-radius:18px 18px 0 0;max-height:78%;display:flex;flex-direction:column;
  padding-bottom:env(safe-area-inset-bottom,0px);box-shadow:0 -8px 30px rgba(0,0,0,.18)}
.sheet .grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:8px auto 2px}
.sheet .sh{display:flex;align-items:center;justify-content:space-between;padding-block:6px}
.sheet h2{font-size:18px;margin:0;font-weight:700;text-wrap:balance}
.sheet .body{overflow:auto;padding-bottom:16px;-webkit-overflow-scrolling:touch}
.chips{display:flex;gap:6px;overflow-x:auto;padding-block:6px 10px;scrollbar-width:none}
.chip{flex:none;height:36px;border-radius:999px;border:1px solid var(--line);background:var(--bg);padding:0 14px;font-weight:600;font-size:14px}
.chip.on{background:var(--fg);color:var(--panel);border-color:var(--fg)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px}
.cell{border:1px solid var(--line);background:var(--bg);border-radius:14px;padding:8px 6px 7px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;min-width:0}
.cell svg{width:100%;height:64px}
.cell b{font-size:12.5px;font-weight:600;line-height:1.2}
.cell small{font-family:var(--mono);font-size:11px;color:var(--muted)}
.sect{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:16px 0 8px}
.list{display:flex;flex-direction:column;gap:6px}
.vitem{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--bg);text-align:left;width:100%}
.vitem.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.vitem span{flex:1;min-width:0;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vitem small{color:var(--muted);font-size:12px}
.wrapbtns{display:flex;flex-wrap:wrap;gap:8px}
.tog{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 2px;border-bottom:1px solid var(--line)}
.tog:last-child{border-bottom:0}
.sw{position:relative;width:48px;height:28px;flex:none}
.sw input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.sw i{position:absolute;inset:0;border-radius:99px;background:var(--line);transition:background .15s}
.sw i::after{content:"";position:absolute;width:22px;height:22px;left:3px;top:3px;border-radius:50%;background:var(--panel);box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .15s}
.sw input:checked+i{background:var(--accent)}
.sw input:checked+i::after{transform:translateX(20px)}
.sw input:focus-visible+i{outline:2px solid var(--accent);outline-offset:2px}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:transparent;padding:7px 12px;font-weight:600;font-size:14px}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.note{color:var(--muted);font-size:13.5px;line-height:1.55;max-width:65ch}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px;padding:10px;border-radius:12px;background:var(--bg);border:1px solid var(--line)}
.toast{position:fixed;left:50%;bottom:calc(140px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--panel);
  padding:9px 16px;border-radius:999px;font-size:14px;font-weight:600;z-index:40;pointer-events:none;max-width:calc(100% - 32px);text-align:center}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .2s ease-out}@keyframes up{from{transform:translateY(30px);opacity:.4}}}
@media (min-width:720px){.sheet{left:50%;right:auto;width:640px;transform:translateX(-50%)}
  @media (prefers-reduced-motion:no-preference){.sheet{animation:none}}}
</style>

<div id="app">
  <header class="band">
    <button class="vbtn" id="vbtn" aria-label="Варианты и настройки">
      <b><span id="vname">Вариант</span><svg width="14" height="14" viewBox="0 0 24 24" style="stroke:currentColor;fill:none;stroke-width:2.4;flex:none"><path d="m6 9 6 6 6-6"/></svg></b>
      <small id="status">Кв. №33 · 6 этаж</small>
    </button>
    <button class="ib" id="undo" aria-label="Отменить"><svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg></button>
    <button class="ib" id="redo" aria-label="Повторить"><svg viewBox="0 0 24 24"><path d="m15 14 5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg></button>
    <button class="ib" id="menu" aria-label="Меню"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
  </header>
  <main>
    <svg id="cv" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <clipPath id="roomsClip"></clipPath>
        <pattern id="tile" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="var(--grid)" stroke-opacity=".10" stroke-width=".8"/></pattern>
      </defs>
      <g id="world">
        <g id="Lstatic"></g>
        <g id="Lgrid"></g>
        <g id="Llabels"></g>

        <g id="Litems"></g>
        <g id="Lover"></g>

      <button class="ib" id="zout" aria-label="Отдалить"><svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button>
    </div>
  </main>
  <footer class="band" id="foot"></footer>
</div>
<div id="layer"></div>

<script>
/* ============ Геометрия квартиры (с плана БТИ) ============
   Исходные размеры в метрах в системе фото (u — вправо, v — вниз),
   на экране план повёрнут: лоджия сверху, вход снизу. Мировые единицы — сантиметры. */
const P=(u,v)=>[Math.round((v+0.40)*100),Math.round((1.85-u)*100)];
const poly=a=>a.map(([u,v])=>P(u,v));
const OUT=poly([[-9.32,-0.40],[0.50,-0.40],[0.50,-0.10],[1.85,-0.10],[1.85,6.96],[0.50,6.96],[0.50,6.56],[-6.55,6.56],[-6.55,4.68],[-9.32,4.68]]);
const ROOMS=[
  {id:'r3',name:'Комната',area:'17,4 м²',pts:poly([[-5.29,0],[0,0],[0,3.09],[-5.95,3.09],[-5.95,1.30],[-5.29,1.30]]),lab:[195,455]},
  {id:'r4',name:'Комната',area:'19,8 м²',pts:poly([[-5.32,3.21],[0,3.21],[0,6.36],[-6.35,6.36],[-6.35,3.33],[-5.32,3.33]]),lab:[518,640]},
  {id:'r2',name:'Санузел',area:'4,4 м²',pts:poly([[-8.50,0],[-6.05,0],[-6.05,1.80],[-8.50,1.80]]),lab:[130,912],wet:1},
  {id:'r1',name:'Прихожая',area:'6,8 м²',pts:poly([[-9.02,1.95],[-6.05,1.95],[-6.05,3.09],[-6.51,3.09],[-6.51,4.48],[-9.02,4.48]]),lab:[330,890]},
  {id:'r5',name:'Лоджия',area:'≈8,5 м²',pts:poly([[0.5,0.10],[1.77,0.10],[1.77,6.76],[0.5,6.76]]),lab:[383,72]},
];
const WINDOWS=[[135,135,163,50],[456,135,146,50],[50,0,666,8]]; // x,y,w,h
const BOUNDS={x:-20,y:-20,w:756,h:1230};
const EDGES=[];ROOMS.forEach(r=>r.pts.forEach((p,i)=>{const q=r.pts[(i+1)%r.pts.length];EDGES.push([p[0],p[1],q[0],q[1]])}));

/* ============ Каталог мебели ============ [тип рисунка, название, ширина, глубина, цвет, слой] */
const CAT=[
 {cat:'Санузел',items:[['bathtub','Ванна 170',170,75,'bath'],['bathtub','Ванна 150',150,70,'bath'],['shower','Душевой поддон 90',90,90,'bath'],['shower','Душ 120×80',120,80,'bath'],
  ['sink','Раковина',60,45,'bath'],['vanity','Тумба с раковиной',80,46,'bath'],['toilet','Унитаз',38,65,'bath'],['toilet','Унитаз подвесной',36,54,'bath'],['install','Инсталляция',60,20,'tech'],
  ['washer','Стиральная машина',60,55,'tech'],['boiler','Бойлер',45,45,'tech'],['towel','Полотенцесушитель',50,12,'tech'],['bookcase','Шкафчик',40,30,'wood']]},
 {cat:'Кухня',items:[['base','Модуль 60',60,60,'kitchen'],['base','Модуль 40',40,60,'kitchen'],['base','Модуль 80',80,60,'kitchen'],['ksink','Мойка',80,60,'kitchen'],
  ['hob','Плита',60,60,'tech'],['fridge','Холодильник',60,65,'tech'],['fridge','Холодильник Side-by-Side',90,70,'tech'],['dish','Посудомойка 45',45,60,'tech'],['dish','Посудомойка 60',60,60,'tech'],
  ['column','Пенал / духовка',60,60,'kitchen'],['corner','Угловой модуль',100,100,'kitchen'],['upper','Навесной шкаф',60,35,'kitchen',2],['hood','Вытяжка',60,50,'tech',2],
  ['table','Остров',120,80,'kitchen'],['table','Барная стойка',150,45,'wood']]},
 {cat:'Гостиная',items:[['sofa','Диван 3-местный',220,95,'soft'],['sofa','Диван 2-местный',170,90,'soft'],['csofa','Угловой диван',270,170,'soft'],['armchair','Кресло',85,85,'soft'],
  ['table','Журнальный стол',100,60,'wood'],['round','Столик круглый',60,60,'wood'],['tvstand','ТВ-тумба',180,40,'wood'],['tv','Телевизор',145,8,'tech'],
  ['bookcase','Стеллаж',80,35,'wood'],['rug','Ковёр',200,140,'rug',0],['plant','Растение',45,45,'plant']]},
 {cat:'Спальня',items:[['bed','Кровать 160×200',160,200,'soft'],['bed','Кровать 180×200',180,200,'soft'],['bed','Кровать 140×200',140,200,'soft'],['bed','Кровать 90×200',90,200,'soft'],
  ['crib','Детская кроватка',65,125,'wood'],['night','Тумба прикроватная',45,40,'wood'],['wardrobe','Шкаф 180',180,60,'wood'],['wardrobe','Шкаф 120',120,60,'wood'],
  ['dresser','Комод',120,50,'wood'],['dresser','Туалетный столик',100,45,'wood']]},
 {cat:'Столы и стулья',items:[['table','Стол 120×80',120,80,'wood'],['table','Стол 160×90',160,90,'wood'],['round','Стол круглый Ø100',100,100,'wood'],['chair','Стул',45,50,'wood'],
  ['desk','Письменный стол',120,60,'wood'],['ochair','Офисное кресло',60,60,'soft']]},
 {cat:'Прихожая',items:[['wardrobe','Шкаф-купе 150',150,60,'wood'],['shoe','Обувница',80,30,'wood'],['bench','Банкетка',90,40,'soft'],['hanger','Вешалка',90,30,'wood']]},
 {cat:'Двери и прочее',items:[['door','Дверь 70',70,70,'door',0.5],['door','Дверь 80',80,80,'door',0.5],['door','Дверь 90',90,90,'door',0.5],['wall','Перегородка',100,10,'wallf'],
  ['radiator','Радиатор',100,10,'tech'],['rect','Прямоугольник',100,60,'other'],['circle','Круг',60,60,'other']]},
];

/* ============ Рисунки предметов (вид сверху, спинка = верхний край) ============ */
const f=n=>Math.round(n*10)/10;
const R=(x,y,w,h,rx,c)=>`<rect x="${f(x)}" y="${f(y)}" width="${f(Math.max(w,0.5))}" height="${f(Math.max(h,0.5))}" rx="${f(rx||0)}" class="${c}"/>`;
const C=(x,y,r,c)=>`<circle cx="${f(x)}" cy="${f(y)}" r="${f(Math.max(r,0.5))}" class="${c}"/>`;
const E=(x,y,rx,ry,c)=>`<ellipse cx="${f(x)}" cy="${f(y)}" rx="${f(Math.max(rx,0.5))}" ry="${f(Math.max(ry,0.5))}" class="${c}"/>`;
const L=(x1,y1,x2,y2,c)=>`<line x1="${f(x1)}" y1="${f(y1)}" x2="${f(x2)}" y2="${f(y2)}" class="${c||'l'}"/>`;
const PA=(d,c)=>`<path d="${d}" class="${c}"/>`;
const DRAW={
 rect:(w,d)=>R(-w/2,-d/2,w,d,2,'b'),
 circle:(w,d)=>E(0,0,w/2,d/2,'b'),
 bathtub:(w,d)=>R(-w/2,-d/2,w,d,8,'b')+R(-w/2+7,-d/2+7,w-14,d-14,Math.min(w,d)/2.6,'l')+C(w/2-20,0,3,'l'),
 shower:(w,d)=>R(-w/2,-d/2,w,d,4,'b')+L(-w/2+5,-d/2+5,w/2-5,d/2-5,'lt')+L(w/2-5,-d/2+5,-w/2+5,d/2-5,'lt')+C(0,0,4,'l'),
 sink:(w,d)=>R(-w/2,-d/2,w,d,5,'b')+E(0,3,w*.36,d*.32,'l')+C(0,-d/2+6,2.5,'l'),
 vanity:(w,d)=>R(-w/2,-d/2,w,d,3,'b')+E(0,2,w*.3,d*.3,'l')+C(0,-d/2+6,2.5,'l'),

let db=null, saveTimer=null, saving=false, dirty=false, cloudOK=false;

  if(db){setStatus('Сохраняю…');saveTimer=setTimeout(flush,900)}else setStatus(inClaude()?'Сохранено на этом устройстве':'Сохранено в этом браузере')}
async function flush(){if(!db||saving||!dirty)return;saving=true;dirty=false;
  try{await db.doc('plans/main').set(JSON.parse(JSON.stringify(S)));setStatus('Сохранено');cloudOK=true}
  catch(e){setStatus(e&&e.code==='quota_exceeded'?'Нет места для сохранения':'Не сохранилось в облако, копия на устройстве');dirty=true}
  saving=false;if(dirty){clearTimeout(saveTimer);saveTimer=setTimeout(flush,1500)}}
(async()=>{
  try{db=window.claude&&window.claude.use?await window.claude.use('db'):null}catch(e){db=null}
  if(!db){setStatus(inClaude()?'Сохранено на этом устройстве':'Сохранено в этом браузере');return}
  setStatus('Загружаю…');
  let done=false;const tm=setTimeout(()=>{if(!done)setStatus('Облако не отвечает, работаю на устройстве')},10000);
  try{const snap=await db.doc('plans/main').get();done=true;clearTimeout(tm);
    const o=snap.exists?snap.data():null;
    if(o&&o.variants&&o.variants.length&&(o.updatedAt||0)>=(S.updatedAt||0)){
      S=JSON.parse(JSON.stringify(o));S.settings=Object.assign({dims:true,grid:true,labels:true,magnet:true,step:1},S.settings||{});
      persistLocal();sel=null;hist=[];redo=[];renderAll();setStatus('Сохранено')}
    else if(S.updatedAt){dirty=true;flush()}else setStatus('Сохранено');
  }catch(e){done=true;clearTimeout(tm);setStatus('Облако недоступно, копия на устройстве')}
})();

  ROOMS.forEach(r=>r.pts.forEach((p,i)=>{const q=r.pts[(i+1)%r.pts.length];const len=Math.hypot(q[0]-p[0],q[1]-p[1]);if(len<40)return;
    const mx=(p[0]+q[0])/2,my=(p[1]+q[1])/2,nx=-(q[1]-p[1])/len,ny=(q[0]-p[0])/len;let k=inPoly(mx+nx*5,my+ny*5,r.pts)?1:-1;

        let x2=x,y2=y;if(d==='L')x2=x-dist;if(d==='R')x2=x+dist;if(d==='U')y2=y-dist;if(d==='D')y2=y+dist;

        s+=(d==='L'||d==='R')?`<line x1="${f(x2)}" y1="${f(y-tk)}" x2="${f(x2)}" y2="${f(y+tk)}" class="dline"/>`:`<line x1="${f(x-tk)}" y1="${f(y2)}" x2="${f(x+tk)}" y2="${f(y2)}" class="dline"/>`;
        const tx=(x+x2)/2,ty=(y+y2)/2;s+=`<text x="${f(tx)}" y="${f(ty)}" class="dtxt"${(d==='U'||d==='D')?` transform="rotate(-90 ${f(tx)} ${f(ty)})"`:''}>${Math.round(dist)}</text>`})}}

  $('Lover').innerHTML=s}

      <label class="btn sm" for="fJson" style="cursor:pointer">Загрузить план из файла</label>
      <input type="file" id="fJson" accept=".json,application/json" hidden>
    </div>
    <p class="note" style="margin-top:8px">${inClaude()?'Файл плана нужен, чтобы сделать резервную копию или перенести варианты в другую копию редактора.':'В этой версии план хранится только в этом браузере. Чтобы перенести его на другое устройство или не потерять, скачай файл плана и загрузи его там.'} Загруженные варианты добавятся к текущим, ничего не сотрётся.</p>
    <div class="sect">О плане</div>
    <p class="note">Перерисовано по плану БТИ, квартира №33 на 6 этаже. Высота потолка 2,74 м. Комнаты 17,4 и 19,8 м², санузел 4,4 м², прихожая 6,8 м². Размеры комнат совпадают с планом до 1–2 см. Толщину стен и размеры лоджии я оценил по чертежу, поэтому их стоит перемерить рулеткой. Двери на плане БТИ не нарисованы: я поставил их туда, где они вероятнее всего. Их можно двигать как обычные предметы.</p>
    <p class="note">Как пользоваться: один палец двигает план или предмет, двумя пальцами план приближается. Выбранный предмет показывает расстояние до стен в сантиметрах.</p>`);
  layer.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{S.current=b.dataset.v;sel=null;hist=[];redo=[];renaming=confirmDel=false;changed();renderAll();closeSheet()});
  $('vNew').onclick=()=>{const v={id:uid(),name:'Вариант '+(S.variants.length+1),items:DOORS()};S.variants.push(v);S.current=v.id;sel=null;hist=[];redo=[];changed();renderAll();closeSheet();toast('Создан пустой вариант')};
  $('vDup').onclick=()=>{const c=JSON.parse(JSON.stringify(V()));c.id=uid();c.name=V().name+' (копия)';c.items.forEach(i=>i.id=uid());S.variants.push(c);S.current=c.id;sel=null;hist=[];redo=[];changed();renderAll();closeSheet();toast('Копия создана')};
  $('vRen').onclick=()=>{renaming=!renaming;confirmDel=false;openMenu();if(renaming){const i=$('vName');i.focus();i.select()}};
  $('vDel').onclick=()=>{confirmDel=!confirmDel;renaming=false;openMenu()};
  if(renaming)$('vRenOk').onclick=()=>{const n=$('vName').value.trim();if(n){V().name=n;changed();$('vname').textContent=n}renaming=false;openMenu()};
  if(confirmDel){$('vDelNo').onclick=()=>{confirmDel=false;openMenu()};
    $('vDelOk').onclick=()=>{if(S.variants.length>1){S.variants=S.variants.filter(v=>v.id!==S.current);S.current=S.variants[0].id;hist=[];redo=[]}
      else{const b=snap();V().items=V().items.filter(i=>i.t==='door');pushHist(b)}sel=null;confirmDel=false;changed();renderAll();openMenu()}}
  ['dims','grid','labels','magnet'].forEach(k=>$('t_'+k).onchange=e=>{S.settings[k]=e.target.checked;changed();renderStatic();renderItems()});
  layer.querySelectorAll('[data-st]').forEach(b=>b.onclick=()=>{S.settings.step=+b.dataset.st;changed();openMenu()});
  $('bPng').onclick=exportPng;$('bJson').onclick=exportJson;
  $('fJson').onchange=e=>{const fl=e.target.files&&e.target.files[0];if(fl)importJson(fl);e.target.value=''}}
$('menu').onclick=()=>{renaming=confirmDel=false;openMenu()};$('vbtn').onclick=()=>{renaming=confirmDel=false;openMenu()};

/* ============ Экспорт PNG ============ */
async function saveFile(filename,blob){
  if(inClaude()){let dl=null;try{dl=await window.claude.use('downloads')}catch(e){}
    if(!dl){toast('Сохранение файлов здесь недоступно');return false}
    try{await dl.save({filename,data:blob});return true}catch(e){if(e&&e.code!=='declined')toast('Не получилось сохранить файл');return false}}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=filename;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},4000);return true}
const safeName=n=>String(n).replace(/[^\wа-яё -]/gi,'').trim()||'план';
async function exportJson(){const ok=await saveFile('планировка-кв33.json',new Blob([JSON.stringify({app:'kv33-plan',version:1,variants:S.variants},null,1)],{type:'application/json'}));if(ok)toast('Файл плана сохранён')}
function importJson(file){const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);const vs=(o&&o.variants)||[];
    const good=vs.filter(v=>v&&typeof v.name==='string'&&Array.isArray(v.items));if(!good.length)throw 0;
    good.forEach(v=>{const c=JSON.parse(JSON.stringify(v));c.id=uid();c.items=c.items.filter(i=>i&&DRAW[i.t]&&isFinite(i.x)&&isFinite(i.y)&&i.w>0&&i.d>0).map(i=>Object.assign(i,{id:uid()}));
      if(S.variants.some(x=>x.name===c.name))c.name+=' (из файла)';S.variants.push(c)});
    S.current=S.variants[S.variants.length-1].id;sel=null;hist=[];redo=[];changed();renderAll();closeSheet();toast('Загружено вариантов: '+good.length)}
  catch(e){toast('Это не файл плана. Нужен .json, скачанный отсюда же')}};r.readAsText(file)}
async function exportPng(){
  const cs=getComputedStyle(document.documentElement);const vars=['--wall','--floor','--floor-wet','--grid','--glass','--ink','--dim','--sel','--accent',...Object.values(CATCOLOR)].map(k=>`${k}:${cs.getPropertyValue(k).trim()}`).join(';');
  const W=1600,sc=W/BOUNDS.w,H=Math.round(BOUNDS.h*sc);
  const fs=13/sc*1.6;
  const body=`<rect x="${BOUNDS.x}" y="${BOUNDS.y}" width="${BOUNDS.w}" height="${BOUNDS.h}" fill="${cs.getPropertyValue('--bg').trim()}"/>${$('Lstatic').innerHTML}${$('Lgrid').innerHTML}${$('Llabels').innerHTML}${$('Litems').innerHTML}${$('Ldims').innerHTML}
    <text x="${BOUNDS.x+12}" y="${BOUNDS.y+BOUNDS.h-14}" class="rl2" style="text-anchor:start;fill-opacity:.7">${esc(V().name)} · кв. №33 · сетка 1 м</text>`;
  const s=`<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="${BOUNDS.x} ${BOUNDS.y} ${BOUNDS.w} ${BOUNDS.h}"><defs><clipPath id="roomsClip">${ROOMS.map(r=>`<polygon points="${pts(r.pts)}"/>`).join('')}</clipPath><pattern id="tile" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="var(--grid)" stroke-opacity=".10" stroke-width=".8"/></pattern></defs><style>svg{${vars};--font:system-ui,sans-serif;--mono:ui-monospace,Menlo,monospace;--fs:${f(fs)}px}${SVG_CSS}.hit{fill:none}</style>${body}</svg>`;
  const url=URL.createObjectURL(new Blob([s],{type:'image/svg+xml'}));const img=new Image();
  img.onload=async()=>{const c=document.createElement('canvas');c.width=W;c.height=H;c.getContext('2d').drawImage(img,0,0,W,H);URL.revokeObjectURL(url);
    c.toBlob(async b=>{if(!b){toast('Не получилось собрать картинку');return}if(await saveFile('планировка-'+safeName(V().name)+'.png',b))toast('Картинка сохранена')},'image/png')};
  img.onerror=()=>toast('Не получилось собрать картинку');img.src=url}

let toastT;function toast(t){let el=document.querySelector('.toast');if(!el){el=document.createElement('div');el.className='toast';el.setAttribute('role','status');document.body.appendChild(el)}
  el.textContent=t;el.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>el.hidden=true,2600)}

/* ============ Старт ============ */
renderAll();
requestAnimationFrame(fit);
new ResizeObserver(()=>{if(!userMoved)fit()}).observe(svg);
['pointerdown','wheel'].forEach(ev=>svg.addEventListener(ev,()=>{userMoved=true},{passive:true}));
$('zin').addEventListener('click',()=>userMoved=true);$('zout').addEventListener('click',()=>userMoved=true);
</script>
